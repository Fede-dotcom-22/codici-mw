<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aggiungi PIM · Codici MW</title><link rel="icon" href="../assets/icons/icon-192.png"><link rel="stylesheet" href="../style.css"><style>.adminwrap{max-width:750px;margin:25px auto;padding:20px}.adminform{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;display:grid;gap:15px}.adminform label{display:grid;gap:6px;font-weight:650;font-size:13px}.adminform input,.adminform select{padding:13px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:100%}.adminform button{border:0;background:var(--accent);color:white;border-radius:12px;padding:14px;font-weight:750}.adminform .hint{font-size:13px;color:var(--muted);line-height:1.5}</style></head><body><main class="adminwrap"><a href="../">← Torna al catalogo</a><h1>Aggiungi un PIM</h1><p class="subtle">Inserimento manuale. Il file scaricato deve essere caricato su GitHub per pubblicare le modifiche.</p><form class="adminform" id="form"><label>Categoria<select name="category"><option value="smartphone">Smartphone</option><option value="smartwatch">Smartwatch</option><option value="sportwatch">Sportwatch</option><option value="smartband">Smartband</option></select></label><label>Marchio<input name="brand" required placeholder="Apple"></label><label>Macro-famiglia<input name="series" required placeholder="iPhone 16"></label><label>Modello<input name="model" required placeholder="iPhone 16e"></label><label>Memoria / versione<input name="storage" placeholder="128 GB"></label><label>Colore<input name="color" required placeholder="Nero"></label><label>Codice PIM (6 cifre)<input name="pim" required pattern="[0-9]{6}" inputmode="numeric" maxlength="6" placeholder="387748"></label><label>URL immagine prodotto (facoltativo)<input name="image" type="url" placeholder="https://..."></label><button type="submit">Controlla e scarica catalogo.json</button><div class="hint">Non inserire dati riservati. Il catalogo pubblicato è pubblico. Il modulo non invia dati a un server: modifica una copia del JSON sul tuo dispositivo.</div><div id="message" role="status"></div></form></main><script src="./admin.js"></script></body></html>
