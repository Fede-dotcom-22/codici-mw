<!DOCTYPE html>
<html lang="it" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>FindMW</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind Custom Configuration -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            mw: {
              red: '#DF0000',
              redHover: '#B80000',
              redSoft: 'rgba(223, 0, 0, 0.08)',
              redSoftDark: 'rgba(223, 0, 0, 0.16)',
            },
            light: {
              bg: '#F5F6F8',
              card: '#FFFFFF',
              subtle: '#EEF0F4',
              border: '#E4E7EC',
              text: '#0F1115',
              muted: '#525866',
            },
            dark: {
              bg: '#0B0C0E',
              card: '#14161B',
              subtle: '#1C1F26',
              border: '#232730',
              text: '#F8FAFC',
              muted: '#94A3B8',
            }
          },
          boxShadow: {
            'card-light': '0 1px 3px rgba(15, 17, 21, 0.04), 0 1px 2px rgba(15, 17, 21, 0.02)',
            'card-hover': '0 10px 25px -5px rgba(15, 17, 21, 0.07), 0 4px 10px -6px rgba(15, 17, 21, 0.04)',
            'mw-glow': '0 6px 20px -4px rgba(223, 0, 0, 0.35)',
          }
        }
      }
    };
  </script>

  <style>
    /* Base Reset & Smooth Theme Transitions */
    html { touch-action: manipulation; }
    html, body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-x: none;
    }
    body {
      text-size-adjust: 100%;
      -webkit-text-size-adjust: 100%;
    }
    img {
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Hide Scrollbars cleanly for horizontal pill rows */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Tabular numbers for 6-digit PIM codes */
    .pim-code {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.06em;
    }

    /* Subtle entrance micro-animation */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-view {
      animation: fadeSlideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Safe area spacing for iOS/Android bottom bar */
    .pb-safe-nav {
      padding-bottom: calc(4.75rem + env(safe-area-inset-bottom, 0px));
    }
    .bottom-nav-safe {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
  </style>
</head>

<body class="bg-light-bg text-light-text dark:bg-dark-bg dark:text-dark-text transition-colors duration-200 min-h-screen flex flex-col">

  <!-- ===================================================================== -->
  <!-- TOP STICKY HEADER                                                     -->
  <!-- ===================================================================== -->
  <header class="sticky top-0 z-40 bg-white/90 dark:bg-dark-card/90 backdrop-blur-md border-b border-light-border dark:border-dark-border transition-colors duration-200">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">

      <!-- Left: Brand Identity + Prototype Status Badge -->
      <div class="flex items-center gap-3 min-w-0">
        <button
          onclick="navigateTo('home')"
          class="flex items-center gap-2.5 text-left group focus:outline-none"
          aria-label="Torna alla Homepage FindMW"
        >
          <!-- Geometric MediaWorld Red Emblem -->
          <div class="w-9 h-9 rounded-xl bg-white dark:bg-dark-subtle border border-light-border dark:border-dark-border flex items-center justify-center shadow-sm overflow-hidden shrink-0">
            <img src="./assets/icons/icon-192.png" alt="Logo FindMW" class="w-full h-full object-cover" />
          </div>

          <div class="flex items-center gap-2">
            <span class="font-extrabold text-xs sm:text-sm tracking-tight text-light-text dark:text-dark-text">
              Find<span class="text-mw-red">MW</span>
            </span>
            <span class="px-1.5 py-0.5 text-[11px] font-bold tracking-wider uppercase rounded-md bg-mw-red text-white leading-none">
              2.0
            </span>
          </div>
        </button>

        <!-- Sober Prototype Indicator -->
        <span class="hidden lg:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-medium bg-light-subtle dark:bg-dark-subtle text-light-muted dark:text-dark-muted border border-light-border dark:border-dark-border">
          <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
          Catalogo PIM
        </span>
      </div>

      <!-- Center: Desktop Navigation Tabs -->
      <nav class="hidden md:flex items-center gap-1 bg-light-subtle/80 dark:bg-dark-subtle/80 p-1 rounded-xl border border-light-border/70 dark:border-dark-border" aria-label="Navigazione principale">
        <button
          id="nav-desktop-catalog"
          onclick="navigateTo('home')"
          class="px-3.5 py-1.5 rounded-lg text-sm font-semibold transition-all flex items-center gap-2"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          Catalogo
        </button>

        <button
          id="nav-desktop-search"
          onclick="navigateTo('search')"
          class="px-3.5 py-1.5 rounded-lg text-sm font-semibold transition-all flex items-center gap-2"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          Ricerca
        </button>
        <button
          id="nav-desktop-add"
          onclick="window.location.href='./admin/'"
          class="px-3.5 py-1.5 rounded-lg text-sm font-semibold transition-all flex items-center gap-1.5"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
          Aggiungi
        </button>
      </nav>

      <!-- Right: Mobile Demo Pill + Theme Toggle -->
      <div class="flex items-center gap-2">
        <span class="lg:hidden inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[10px] font-semibold uppercase tracking-wide bg-light-subtle dark:bg-dark-subtle text-light-muted dark:text-dark-muted border border-light-border dark:border-dark-border">
          <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
          FindMW
        </span>

        <button
          onclick="toggleTheme()"
          class="w-10 h-10 rounded-xl bg-light-subtle dark:bg-dark-subtle hover:bg-light-border/70 dark:hover:bg-dark-border border border-light-border dark:border-dark-border flex items-center justify-center text-light-text dark:text-dark-text transition-colors"
          aria-label="Cambia tema chiaro o scuro"
          title="Cambia tema Chiaro / Scuro"
        >
          <!-- Sun Icon (shown in dark mode) -->
          <svg id="icon-sun" class="w-5 h-5 hidden dark:block text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-15.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
          <!-- Moon Icon (shown in light mode) -->
          <svg id="icon-moon" class="w-5 h-5 block dark:hidden text-light-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
        </button>
      </div>

    </div>
  </header>

  <!-- ===================================================================== -->
  <!-- MAIN APPLICATION VIEWPORT                                             -->
  <!-- ===================================================================== -->
  <main id="app-main" class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 pt-4 sm:pt-6 pb-safe-nav md:pb-10">
    <!-- Dynamic screen content injected cleanly via JS state engine -->
  </main>

  <!-- ===================================================================== -->
  <!-- MOBILE FIXED BOTTOM NAVIGATION BAR                                    -->
  <!-- ===================================================================== -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white/95 dark:bg-dark-card/95 backdrop-blur-md border-t border-light-border dark:border-dark-border bottom-nav-safe" aria-label="Navigazione mobile">
    <div class="grid grid-cols-3 h-16 max-w-md mx-auto">
      <button
        id="nav-mobile-catalog"
        onclick="navigateTo('home')"
        class="flex flex-col items-center justify-center gap-1 text-[11px] font-semibold transition-colors"
      >
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>Catalogo</span>
      </button>

      <button
        id="nav-mobile-search"
        onclick="navigateTo('search')"
        class="flex flex-col items-center justify-center gap-1 text-[11px] font-semibold transition-colors"
      >
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Cerca</span>
      </button>

      <button
        id="nav-mobile-add"
        onclick="window.location.href='./admin/'"
        class="flex flex-col items-center justify-center gap-1 text-[11px] font-semibold transition-colors"
      >
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
        <span>Aggiungi</span>
      </button>
    </div>
  </nav>

  <!-- ===================================================================== -->
  <!-- NON-INTRUSIVE TOAST NOTIFICATION CONTAINER                            -->
  <!-- ===================================================================== -->
  <div id="toast-container" class="fixed bottom-20 md:bottom-6 right-4 left-4 md:left-auto md:w-96 z-50 pointer-events-none flex flex-col gap-2 items-center md:items-end"></div>

  <!-- ===================================================================== -->
  <!-- APPLICATION DATA, VECTOR ART ENGINE & INTERACTIVE CONTROLLER          -->
  <!-- ===================================================================== -->
  <script>
    /**
     * =========================================================================
     * 1. ALLOWED CATEGORIES (STRICT: NO TABLETS)
     * =========================================================================
     */
    const CATEGORIES = ['Tutti', 'Smartphone', 'Smartwatch', 'Ring'];

    /**
     * =========================================================================
     * 2. BRANDS DIRECTORY WITH CUSTOM MONOCHROME VECTOR LOGOS
     * =========================================================================
     */
    const BRANDS = [
      {
        id: 'apple',
        name: 'Apple',
        logo: `<svg class="h-7 w-auto" viewBox="0 0 32 32" fill="currentColor"><path d="M21.8 16.9c0-3.1 2.5-4.6 2.6-4.7-1.4-2.1-3.6-2.4-4.4-2.4-1.9-.2-3.7 1.1-4.6 1.1-.9 0-2.4-1.1-4-1.1-2.1 0-4 1.2-5.1 3.1-2.2 3.8-.6 9.4 1.6 12.5 1.1 1.5 2.3 3.2 4 3.1 1.6-.1 2.2-1 4.1-1 1.9 0 2.5 1 4.1 1 1.7 0 2.8-1.5 3.9-3.1 1.2-1.8 1.7-3.5 1.8-3.6-.1-.1-4-1.5-4-4.9zM18.8 7.8c.9-1.1 1.5-2.6 1.3-4.1-1.3.1-2.9.9-3.8 1.9-.8.9-1.5 2.5-1.3 4 1.4.1 2.9-.7 3.8-1.8z"/></svg>`
      },
      {
        id: 'samsung',
        name: 'Samsung',
        logo: `<svg class="h-6 w-auto" viewBox="0 0 120 28" fill="currentColor"><text x="60" y="20" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" letter-spacing="2.2">SAMSUNG</text></svg>`
      },
      {
        id: 'xiaomi',
        name: 'Xiaomi',
        logo: `<svg class="h-7 w-auto" viewBox="0 0 36 36" fill="none"><rect x="2" y="2" width="32" height="32" rx="9" fill="currentColor"/><path d="M10.5 23.5v-9.2c0-.9.7-1.6 1.6-1.6h6.2c1.7 0 2.9 1.2 2.9 2.9v7.9h-2.6v-7.4c0-.5-.3-.8-.8-.8h-4.7v8.2h-2.6zm4.2-5.7h2.4v5.7h-2.4v-5.7zm8.4-5.1h2.6v10.8h-2.6V12.7z" class="text-white dark:text-dark-card" fill="currentColor"/></svg>`
      },
      {
        id: 'google',
        name: 'Google',
        logo: `<svg class="h-6 w-auto" viewBox="0 0 32 32" fill="currentColor"><path d="M16.3 13.7v4.8h6.8c-.3 1.7-1.9 4.9-6.8 4.9-4.1 0-7.4-3.4-7.4-7.5s3.3-7.5 7.4-7.5c2.3 0 3.9 1 4.8 1.8l3.3-3.2C22.3 5.1 19.6 4 16.3 4 9.7 4 4.3 9.4 4.3 16s5.4 12 12 12c6.9 0 11.5-4.9 11.5-11.7 0-.8-.1-1.4-.2-2h-11.3z"/></svg>`
      },
      {
        id: 'oppo',
        name: 'Oppo',
        logo: `<svg class="h-6 w-auto" viewBox="0 0 100 28" fill="currentColor"><text x="50" y="20" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" letter-spacing="3">oppo</text></svg>`
      },
      {
        id: 'motorola',
        name: 'Motorola',
        logo: `<svg class="h-7 w-auto" viewBox="0 0 36 36" fill="none"><circle cx="18" cy="18" r="15" stroke="currentColor" stroke-width="2.4"/><path d="M10.5 24.5L15 11l3 8.2L21 11l4.5 13.5h-2.4l-2.3-7-2.8 7.2-2.8-7.2-2.3 7h-2.4z" fill="currentColor"/></svg>`
      },
      {
        id: 'garmin',
        name: 'Garmin',
        logo: `<svg class="h-6 w-auto" viewBox="0 0 115 28" fill="currentColor"><polygon points="57.5,2 63,9 52,9" /><text x="57.5" y="23" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" letter-spacing="2.8">GARMIN</text></svg>`
      },
      {
        id: 'amazfit',
        name: 'Amazfit',
        logo: `<svg class="h-6 w-auto" viewBox="0 0 115 28" fill="currentColor"><text x="57.5" y="20" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16.5" letter-spacing="2.2">AMAZFIT</text></svg>`
      },
      {
        id: 'huawei',
        name: 'Huawei',
        logo: `<svg class="h-6 w-auto" viewBox="0 0 115 28" fill="currentColor"><text x="57.5" y="20" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="17" letter-spacing="2.4">HUAWEI</text></svg>`
      },
      {
        id: 'honor',
        name: 'Honor',
        logo: `<svg class="h-6 w-auto" viewBox="0 0 105 28" fill="currentColor"><text x="52.5" y="20" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" letter-spacing="2.8">HONOR</text></svg>`
      }
    ];

    /**
     * =========================================================================
     * 3. DEMO CATALOG DATASET (RICH, REALISTIC, STRICTLY NO TABLETS)
     * Every variant has a unique 6-digit PIM code and source: 'DEMO'
     * =========================================================================
     */
    const INITIAL_CATALOG = [];

    /**
     * =========================================================================
     * 4. APPLICATION STATE
     * =========================================================================
     */
    const state = {
      theme: 'light',
      view: 'home', // 'home' | 'catalog' | 'search' | 'add'
      selectedCategory: 'Tutti',
      // Catalog drill-down state
      selectedBrandId: null,
      selectedFamilyId: null,
      selectedModelId: null,
      selectedMemorySize: null,
      previewColorHex: null, // Dynamic tint in model detail
      // Search state
      searchQuery: '',
      searchCategory: 'Tutti',
      searchSourceFilter: 'ALL', // 'ALL' | 'MANUALE'
      // Dynamic data (mutable in session so Manual Product works live)
      brands: [...BRANDS],
      families: [],
      // Manual Add Form State
      manualForm: {
        category: 'Smartphone',
        brandName: 'Apple',
        familyName: 'iPhone 16',
        modelName: '',
        memorySize: '128 GB',
        colorName: 'Nero Opaco',
        colorHex: '#1E2024',
        pimCode: ''
      }
    };

    /**
     * =========================================================================
     * 5. HIGH-PRECISION VECTOR HARDWARE ILLUSTRATIONS (SVG RENDERER)
     * Renders realistic smartphones, smartwatches, sportwatches, and smartbands
     * =========================================================================
     */
    function renderDeviceSVG(category, designStyle = '', tintHex = '#2B2E34', sizeClass = 'w-20 h-24') {
      const bodyColor = tintHex || '#2B2E34';
      const style = designStyle || (
        category === 'Smartwatch' ? 'watch-square' :
        category === 'Sportwatch' ? 'sport-rugged' :
        category === 'Smartband' ? 'band-slim' : 'iphone-dual'
      );

      // SMART RING: compact wearable ring illustration
      if (category === 'Ring' || style === 'ring') {
        return `
          <svg class="${sizeClass} shrink-0" viewBox="0 0 84 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="ringBody" x1="12" y1="25" x2="72" y2="75" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#9CA3AF"/><stop offset="0.45" stop-color="${bodyColor}"/><stop offset="1" stop-color="#111827"/>
              </linearGradient>
            </defs>
            <ellipse cx="42" cy="49" rx="29" ry="24" fill="url(#ringBody)" stroke="#94A3B8" stroke-width="1.5"/>
            <ellipse cx="42" cy="49" rx="16" ry="13" fill="#0B0C0E" stroke="#475569" stroke-width="2"/>
            <path d="M18 40c10-13 35-18 47-4" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3" fill="none"/>
          </svg>
        `;
      }

      // SMARTBAND (Slender capsule display + tapered elastomer strap)
      if (category === 'Smartband' || style === 'band-slim') {
        return `
          <svg class="${sizeClass} shrink-0" viewBox="0 0 80 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bandScreen-${bodyColor.replace('#','')}" x1="25" y1="22" x2="55" y2="78" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#1E293B"/>
                <stop offset="100%" stop-color="#090D16"/>
              </linearGradient>
            </defs>
            <!-- Top & Bottom Tapered Strap -->
            <path d="M31 6h18l2 18H29L31 6z" fill="${bodyColor}" opacity="0.92"/>
            <path d="M29 76h22l-2 18H31l-2-18z" fill="${bodyColor}" opacity="0.92"/>
            <!-- Strap Buckle Loop -->
            <rect x="30" y="13" width="20" height="3.5" rx="1.5" fill="#000000" opacity="0.28"/>
            <!-- Metallic/Polymer Capsule Frame -->
            <rect x="25" y="21" width="30" height="58" rx="15" fill="${bodyColor}" stroke="#94A3B8" stroke-opacity="0.45" stroke-width="1.5"/>
            <!-- Glass Display -->
            <rect x="27.5" y="23.5" width="25" height="53" rx="12.5" fill="url(#bandScreen-${bodyColor.replace('#','')})"/>
            <!-- Fitness UI Arc & Time -->
            <circle cx="40" cy="41" r="7.5" stroke="#DF0000" stroke-width="2.2" stroke-dasharray="34 14" stroke-linecap="round"/>
            <rect x="33" y="54" width="14" height="3" rx="1.5" fill="#F8FAFC" opacity="0.85"/>
            <rect x="35" y="60" width="10" height="2.2" rx="1.1" fill="#38BDF8" opacity="0.8"/>
            <!-- Subtle Glass Reflection -->
            <path d="M30 28c2-2 5-3 9-3" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        `;
      }

      // SPORTWATCH (Rugged circular bezel, 5 physical buttons, tactical dial)
      if (category === 'Sportwatch' || style === 'sport-rugged') {
        return `
          <svg class="${sizeClass} shrink-0" viewBox="0 0 84 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Top & Bottom Vented Sport Straps -->
            <path d="M29 7h26l2 17H27L29 7z" fill="${bodyColor}"/>
            <path d="M27 76h30l-2 17H29l-2-17z" fill="${bodyColor}"/>
            <rect x="34" y="12" width="16" height="2.5" rx="1.2" fill="#000000" opacity="0.35"/>
            <rect x="34" y="85" width="16" height="2.5" rx="1.2" fill="#000000" opacity="0.35"/>
            <!-- 5 Physical Tactical Buttons -->
            <rect x="13" y="36" width="4" height="7" rx="1.5" fill="#64748B"/>
            <rect x="12" y="47" width="4" height="6" rx="1.5" fill="#64748B"/>
            <rect x="13" y="57" width="4" height="7" rx="1.5" fill="#64748B"/>
            <rect x="67" y="36" width="4" height="8" rx="1.5" fill="#DF0000"/>
            <rect x="67" y="56" width="4" height="7" rx="1.5" fill="#64748B"/>
            <!-- Outer Rugged Case -->
            <circle cx="42" cy="50" r="27" fill="${bodyColor}" stroke="#94A3B8" stroke-opacity="0.4" stroke-width="1.5"/>
            <!-- Stepped Bezel Ring -->
            <circle cx="42" cy="50" r="23.5" fill="#181A1F" stroke="#475569" stroke-width="1.5"/>
            <!-- AMOLED Sports Dial -->

    /**
     * =========================================================================
     * 6. FLATTENED SKU HELPER (ALL VARIANTS ACROSS CATALOG)
     * =========================================================================
     */
    function getAllFlattenedVariants() {
      const list = [];
      state.families.forEach(family => {
        const brand = state.brands.find(b => b.id === family.brandId) || { id: family.brandId, name: family.brandId };
        family.models.forEach(model => {
          model.memories.forEach(mem => {
            mem.variants.forEach(variant => {
              list.push({
                variantId: variant.id,
                pim: variant.pim,
                colorName: variant.colorName,
                colorHex: variant.colorHex,
                source: variant.source || model.source || 'DEMO',
                memorySize: mem.size,
                modelId: model.id,
                modelName: model.name,
                designStyle: model.designStyle,
                familyId: family.id,
                familyName: family.name,
                category: family.category,
                brandId: brand.id,
                brandName: brand.name
              });
            });
          });
        });
      });
      return list;
    }

    /**
     * =========================================================================
     * 7. CLIPBOARD COPY & TOAST NOTIFICATION SYSTEM (NO ALERT() USED)
     * =========================================================================
     */
    function copyPimCode(pim, buttonEl = null) {
      // Safe iframe-compatible copy via textarea + execCommand('copy')
      const tempInput = document.createElement('textarea');
      tempInput.value = pim;
      tempInput.setAttribute('readonly', '');
      tempInput.style.position = 'fixed';
      tempInput.style.left = '-9999px';
      document.body.appendChild(tempInput);
      tempInput.select();
      try {
        document.execCommand('copy');
      } catch (err) {
        // Fallback if restricted
      }
      document.body.removeChild(tempInput);

      // Update button visual state temporarily if passed
      if (buttonEl) {
        const originalHTML = buttonEl.innerHTML;
        buttonEl.classList.remove('bg-mw-red', 'hover:bg-mw-redHover');
        buttonEl.classList.add('bg-emerald-600', 'hover:bg-emerald-700');
        buttonEl.innerHTML = `
          <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          <span>Copiato</span>
        `;
        setTimeout(() => {
          if (document.body.contains(buttonEl)) {
            buttonEl.classList.remove('bg-emerald-600', 'hover:bg-emerald-700');
            buttonEl.classList.add('bg-mw-red', 'hover:bg-mw-redHover');
            buttonEl.innerHTML = originalHTML;
          }
        }, 1600);
      }

      showToast(`Codice PIM <span class="pim-code font-bold text-white bg-white/15 px-1.5 py-0.5 rounded">${pim}</span> copiato negli appunti`);
    }

    function showToast(htmlMessage) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl bg-light-text dark:bg-zinc-900 text-white text-xs sm:text-sm font-medium shadow-xl border border-white/10 animate-view max-w-full';
      toast.innerHTML = `
        <span class="w-5 h-5 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center shrink-0">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        </span>
        <div class="truncate">${htmlMessage}</div>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(6px)';
        toast.style.transition = 'all 0.2s ease';
        setTimeout(() => toast.remove(), 220);
      }, 2400);
    }

    /**
     * =========================================================================
     * 8. NAVIGATION & THEME CONTROLLER
     * =========================================================================
     */
    function toggleTheme() {
      const html = document.documentElement;
      if (state.theme === 'light') {
        state.theme = 'dark';
        html.classList.remove('light');
        html.classList.add('dark');
      } else {
        state.theme = 'light';
        html.classList.remove('dark');
        html.classList.add('light');
      }
      try{localStorage.setItem('codici-mw-theme',state.theme);}catch{}
    }

    function navigateTo(view, options = {}) {
      state.view = view;
      if (options.brandId !== undefined) state.selectedBrandId = options.brandId;
      if (options.familyId !== undefined) state.selectedFamilyId = options.familyId;
      if (options.modelId !== undefined) {
        state.selectedModelId = options.modelId;
        state.previewColorHex = null;
        // Default to first available memory size of selected model
        const fam = state.families.find(f => f.id === state.selectedFamilyId);
        const mod = fam?.models.find(m => m.id === options.modelId);
        state.selectedMemorySize = mod?.memories[0]?.size || null;
      }
      if (options.memorySize !== undefined) state.selectedMemorySize = options.memorySize;
      if (options.searchQuery !== undefined) state.searchQuery = options.searchQuery;

      updateNavHighlights();
      renderApp(true);

      if (options.focusSearch) {
        setTimeout(() => {
          const input = document.getElementById('global-search-input');
          if (input) {
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
          }
        }, 30);
      }
    }

    function updateNavHighlights() {
      const isCatalogActive = state.view === 'home' || state.view === 'catalog';
      const desktopMap = {
        catalog: isCatalogActive,
        search: state.view === 'search',
        add: state.view === 'add'
      };

      Object.entries(desktopMap).forEach(([key, active]) => {
        const dBtn = document.getElementById(`nav-desktop-${key}`);
        const mBtn = document.getElementById(`nav-mobile-${key}`);
        if (dBtn) {
          dBtn.className = active
            ? 'px-3.5 py-1.5 rounded-lg text-sm font-semibold transition-all flex items-center gap-2 bg-white dark:bg-dark-card text-mw-red shadow-sm'
            : 'px-3.5 py-1.5 rounded-lg text-sm font-semibold transition-all flex items-center gap-2 text-light-muted dark:text-dark-muted hover:text-light-text dark:hover:text-dark-text';
        }
        if (mBtn) {
          mBtn.className = active
            ? 'relative flex flex-col items-center justify-center gap-1 text-[11px] font-bold text-mw-red transition-colors'
            : 'relative flex flex-col items-center justify-center gap-1 text-[11px] font-semibold text-light-muted dark:text-dark-muted hover:text-light-text dark:hover:text-dark-text transition-colors';
        }
      });
    }

      if (state.previewColorHex === hex) return;

      // Update SVG preview smoothly without losing scroll position
      const scrollY = window.scrollY;
      renderApp(false);
      window.scrollTo(0, scrollY);
    }

    /**
     * =========================================================================
     * 13. SCREEN 3: SEARCH & INSTANT RESULTS
     * =========================================================================
     */
    function renderSearchView() {
      const allVariants = getAllFlattenedVariants();
      const q = state.searchQuery.trim().toLowerCase();

      const results = allVariants.filter(item => {
        const matchesCategory = state.searchCategory === 'Tutti' || item.category === state.searchCategory;
        if (!matchesCategory) return false;

        if (state.searchSourceFilter === 'MANUALE' && item.source !== 'MANUALE') {
          return false;
        }

        if (!q) return true;

        // Multi-token search across PIM, brand, family, model, memory, color
        const tokens = q.split(/\s+/);
        const haystack = `${item.pim} ${item.brandName} ${item.familyName} ${item.modelName} ${item.memorySize} ${item.colorName} ${item.category}`.toLowerCase();
        return tokens.every(t => haystack.includes(t));
      });

      const manualCount = allVariants.filter(v => v.source === 'MANUALE').length;

      return `
        <div class="space-y-5 animate-view">

          <!-- Search Input Card -->
          <div class="bg-white dark:bg-dark-card rounded-2xl p-4 sm:p-5 border border-light-border dark:border-dark-border shadow-card-light space-y-3.5">
            <div class="flex items-center justify-between gap-2">
              <h1 class="text-xs sm:text-sm font-extrabold tracking-tight">Ricerca PIM</h1>

            </div>

              <span class="absolute inset-y-0 left-3.5 flex items-center text-mw-red pointer-events-none">

              </span>

                id="global-search-input"
                type="text"
                value="${escapeHtml(state.searchQuery)}"
                placeholder="Digita modello (es. iPhone 16e), colore, memoria o codice PIM a 6 cifre..."
                oninput="updateSearchQuery(this.value)"
                class="w-full pl-11 pr-11 py-3 rounded-xl bg-light-subtle/80 dark:bg-dark-subtle border border-light-border dark:border-dark-border text-base sm:text-sm font-medium focus:outline-none focus:border-mw-red focus:ring-2 focus:ring-mw-red/20 transition-all"
              />
              ${state.searchQuery ? `
                <button
                  onclick="updateSearchQuery('', true)"
                  class="absolute right-3 top-1/2 -translate-y-1/2 w-7 h-7 rounded-lg bg-light-border/70 dark:bg-dark-border hover:bg-mw-red hover:text-white flex items-center justify-center text-xs font-bold transition-colors"
                  aria-label="Cancella ricerca"
                >
                  ✕
                </button>
              ` : ''}
            </div>

            <!-- Category & Source Filters (Single Horizontal Row) -->
            <div class="flex flex-nowrap items-center gap-2 overflow-x-auto no-scrollbar pt-0.5">
              ${CATEGORIES.map(cat => {
                const active = state.searchCategory === cat;
                return `
                  <button
                    onclick="updateSearchCategory('${cat}')"
                    class="px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap shrink-0 transition-all border ${
                      active
                        ? 'bg-mw-red text-white border-mw-red'
                        : 'bg-light-subtle/70 dark:bg-dark-subtle text-light-text dark:text-dark-text border-light-border dark:border-dark-border hover:border-mw-red/50'
                    }"
                  >
                    ${cat}
                  </button>
                `;
              }).join('')}

              ${manualCount > 0 ? `
                <span class="h-4 w-[1px] bg-light-border dark:bg-dark-border shrink-0 mx-1"></span>
                <button
                  onclick="toggleManualSourceFilter()"
                  class="px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap shrink-0 transition-all border ${
                    state.searchSourceFilter === 'MANUALE'
                      ? 'bg-emerald-600 text-white border-emerald-600'
                      : 'bg-emerald-500/10 text-emerald-700 dark:text-emerald-400 border-emerald-500/25'
                  }"
                >
                  Solo Manuali (${manualCount})
                </button>
              ` : ''}
            </div>
          </div>

          <!-- Store-Ready Results List -->
          ${results.length > 0 ? `
            <div class="space-y-2.5">
              ${results.map(item => renderStoreResultCard(item)).join('')}
            </div>
          ` : `
            <div class="bg-white dark:bg-dark-card rounded-2xl p-10 border border-light-border dark:border-dark-border text-center space-y-3">
              <div class="w-12 h-12 rounded-2xl bg-light-subtle dark:bg-dark-subtle text-light-muted dark:text-dark-muted flex items-center justify-center mx-auto">
                <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

    function updateManualField(field, value) {
      state.manualForm[field] = value;
      // Refresh preview smoothly while keeping focus on active input
      const activeId = document.activeElement?.id;
      const selStart = document.activeElement?.selectionStart;
      renderApp(false);
      if (activeId) {
        const el = document.getElementById(activeId);
        if (el) {
          el.focus();
          if (typeof selStart === 'number') el.setSelectionRange(selStart, selStart);
        }
      }
    }

    function selectPresetSwatch(name, hex) {
      state.manualForm.colorName = name;
      state.manualForm.colorHex = hex;
      renderApp(false);
    }

    function updateManualPim(rawVal) {
      const digitsOnly = rawVal.replace(/\D/g, '').slice(0, 6);
      state.manualForm.pimCode = digitsOnly;
      renderApp(false);
      const input = document.getElementById('manual-pim');
      if (input) {
        input.focus();
        input.setSelectionRange(digitsOnly.length, digitsOnly.length);
      }
    }

    function generateRandomManualPim() {
      const randomSix = String(Math.floor(100000 + Math.random() * 900000));
      state.manualForm.pimCode = randomSix;
      renderApp(false);
    }

    function submitManualProduct(event) {
      event.preventDefault();
      const f = state.manualForm;
      f.category = normalizeCategory(f.category);

      if (!/^\d{6}$/.test(f.pimCode)) {
        showToast('Inserisci un codice PIM valido composto da esattamente 6 cifre.');
        const input = document.getElementById('manual-pim');
        if (input) input.focus();
        return;
      }

      const brandName = f.brandName.trim();
      const familyName = f.familyName.trim();
      const modelName = f.modelName.trim();
      const memorySize = f.memorySize.trim();
      const colorName = f.colorName.trim();

      if (!brandName || !familyName || !modelName || !memorySize || !colorName) {
        showToast('Compila tutti i campi obbligatori prima di salvare.');
        return;
      }

      if (getAllFlattenedVariants().some(v => v.pim === f.pimCode)) {
        showToast('Questo codice PIM è già presente nel catalogo.');
        return;
      }
      // 1. Find or create Brand
      let brand = state.brands.find(b => b.name.toLowerCase() === brandName.toLowerCase());
      if (!brand) {
        const newBrandId = 'brand-' + Date.now();
        brand = {
          id: newBrandId,
          name: brandName,
          logo: `<svg class="h-6 w-auto" viewBox="0 0 115 28" fill="currentColor"><text x="57.5" y="20" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16.5" letter-spacing="2">${escapeHtml(brandName.toUpperCase())}</text></svg>`
        };
        state.brands.push(brand);
      }

      // 2. Find or create Macro-Family
      let family = state.families.find(fam =>
        fam.brandId === brand.id &&
        fam.name.toLowerCase() === familyName.toLowerCase() &&
        fam.category === f.category
      );
      if (!family) {
        family = {
          id: 'fam-' + Date.now(),
          brandId: brand.id,
          name: familyName,
          category: f.category,
          source: 'MANUALE',
          models: []
        };
        state.families.unshift(family);
      }

      // 3. Find or create Model
      let model = family.models.find(m => m.name.toLowerCase() === modelName.toLowerCase());
      if (!model) {
        model = {
          id: 'mod-' + Date.now(),
          name: modelName,
          designStyle: '',
          source: 'MANUALE',
          memories: []
        };
        family.models.unshift(model);
      }

      // 4. Find or create Memory size
      let memObj = model.memories.find(mem => mem.size.toLowerCase() === memorySize.toLowerCase());
      if (!memObj) {
        memObj = { size: memorySize, variants: [] };
        model.memories.push(memObj);
      }

      if (memObj.variants.some(v => v.colorName.toLowerCase() === colorName.toLowerCase())) {
        showToast('Questa variante colore e memoria esiste già.');
        return;
      }
      // 5. Append Variant with source: 'MANUALE'
      const newVariantId = 'v-man-' + Date.now();
      memObj.variants.unshift({
        id: newVariantId,
        colorName: colorName,
        colorHex: f.colorHex,
        pim: f.pimCode,
        source: 'MANUALE'
      });

      // Reset modelName & pimCode for convenient next entry
      const createdPim = f.pimCode;
      saveManualCatalog();
      state.manualForm.modelName = '';
      state.manualForm.pimCode = '';

      showToast(`Prodotto <span class="font-bold">${escapeHtml(modelName)}</span> (PIM ${createdPim}) salvato con badge MANUALE`);

      // Navigate directly to the newly created model detail so user can see it live!
      navigateTo('catalog', {
        brandId: brand.id,
        familyId: family.id,
        modelId: model.id,
        memorySize: memorySize
      });
    }

    /**
     * =========================================================================
     * 16. UTILITY & INITIAL BOOTSTRAP
     * =========================================================================
     */
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderApp(scrollTop = false) {
      const main = document.getElementById('app-main');
      if (!main) return;

      switch (state.view) {
        case 'catalog':
          main.innerHTML = renderCatalogDrilldownView();
          break;
        case 'search':
          main.innerHTML = renderSearchView();
          break;
        case 'add':
          main.innerHTML = renderManualAddView();
          break;
        case 'home':
        default:
          main.innerHTML = renderHomeView();
          break;
      }

      updateNavHighlights();

      if (scrollTop) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }


    // Integration with original FindMW catalogo.json; demo PIMs are never loaded.
    const MW_MANUAL_KEY = 'codici-mw-manual-v1';
    let officialFamilies = [];
    function safeRead(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } }
    function slugify(s) { return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
    // Palette FindMW — sigle del catalogo collega e denominazioni dei produttori.
    // Gli HEX sono rese visive indicative, non valori cromatici ufficiali.
    // Prima applica le corrispondenze precise; poi le parole chiave, evitando
    // che "Blueblack", "Graygreen", "Pink Gold", ecc. diventino un colore generico.
    function inferColorHex(name) {
      const raw = String(name || '').trim();
      const normalized = raw.toLowerCase().normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '').replace(/[-_]+/g, ' ')
        .replace(/\s+/g, ' ').trim();
      const code = raw.toUpperCase().trim();
      const exact = {
        // Quattro nuove associazioni approvate
        BG:'#73334B', GL:'#B7DCEA', CH:'#42464B', GG:'#84978C',
        // Altre 12 sigle approvate
        NA:'#253C61', MI:'#A9CEBF', LI:'#C4B0DF', BB:'#202E46',
        SL:'#C7CCD3', GR:'#8A9098', SH:'#646873', WA:'#82684F',
        BR:'#80644E', CY:'#73C9D1', LA:'#B5A3D2', OL:'#747D57',
        // Sigle gia riconosciute nel catalogo
        BK:'#24262B', B:'#24262B', TBK:'#24262B', STBK:'#24262B',
        'SAPPHIRE BK':'#28354F', 'CRYSTAL BK':'#252930',
        BL:'#426DA4', BLBK:'#24364F', AZ:'#6BAED6',
        GN:'#6C9875', TG:'#497A6A', GY:'#9398A2', SV:'#C6C9D0',
        WH:'#F3F3F0', WHT:'#F3F3F0',
        RD:'#C64043', PK:'#E3A6B9', PU:'#9575B5', PUR:'#9575B5',
        VI:'#967FC0', PURPLE:'#9575B5', GO:'#CFAD65', GD:'#CFAD65',
        'AURORA GOLD':'#D4B473', OR:'#DB8950', YE:'#E8CC60',
        LAV:'#C2A6DA',
      };
      if (Object.prototype.hasOwnProperty.call(exact, code)) return exact[code];
      // Nomi completi della palette preventiva (12 tonalita aggiuntive)
      const specificNames = [
        [/\b(?:icy\s?blue|icyblue|blu ghiaccio|ghiaccio|glacier|glaciale)\b/, '#C5E0EE'],
        [/\b(?:sage|salvia)\b/, '#9AAB94'],
        [/\b(?:natural titanium|titanio naturale|titanium|titanio)\b/, '#A9A6A1'],
        [/\b(?:champagne)\b/, '#D7C5A1'],
        [/\b(?:coral\s?red|coralred|rosso corallo)\b/, '#D96862'],
        [/\b(?:pink\s?gold|pinkgold|oro rosa)\b/, '#D7A6A8'],
        [/\b(?:bronze|bronzo)\b/, '#A47F61'],
        [/\b(?:teal|verde petrolio|blu petrolio)\b/, '#427F83'],
        [/\b(?:cream|crema)\b/, '#EEE3C8'],
        [/\b(?:pearl\s?white|pearlwhite|bianco perla)\b/, '#F3F0EB'],
        [/\b(?:orange|arancione|arancio)\b/, '#DB854B'],
        [/\b(?:indigo|indaco)\b/, '#50548F'],
        // Nomi estesi per le sigle appena integrate
        [/\b(?:burgundy|burgundi|borgogna)\b/, '#73334B'],
        [/\b(?:charcoal|carbone)\b/, '#42464B'],
        [/\b(?:gray\s?green|grey\s?green|graygreen|grigio verde|verde grigio)\b/, '#84978C'],
        [/\b(?:blue\s?black|blueblack|blu nero)\b/, '#202E46'],
        [/\b(?:navy|blu notte)\b/, '#253C61'],
        [/\b(?:mint|menta)\b/, '#A9CEBF'],
        [/\b(?:lilac|lilla)\b/, '#C4B0DF'],
        [/\b(?:silver|argento)\b/, '#C7CCD3'],
        [/\b(?:shadow|ombra)\b/, '#646873'],
        [/\b(?:walnut|noce)\b/, '#82684F'],
        [/\b(?:cyan|ciano)\b/, '#73C9D1'],
        [/\b(?:lavender|lavanda)\b/, '#B5A3D2'],
        [/\b(?:olive|oliva)\b/, '#747D57'],
      ];
      for (const [test, hex] of specificNames) if (test.test(normalized)) return hex;
      if (/ner|black|grafite|graphite|sideral|antracit|carbon|midnight/.test(normalized)) return '#292C35';
      if (/bianc|white|avorio|ivory/.test(normalized)) return '#F4F0E6';
      if (/blu|blue|azzurr|celeste|sapphire/.test(normalized)) return '#527FAE';
      if (/ross|red/.test(normalized)) return '#C7484F';
      if (/verd|green/.test(normalized)) return '#779781';
      if (/rosa|pink|ibisco|fucsia/.test(normalized)) return '#DDA2B3';
      if (/viol|purple|lilac|lilla/.test(normalized)) return '#A18ABB';
      if (/grig|gray|grey|nebbia/.test(normalized)) return '#969BA4';
      if (/oro|gold|sabbia|sand/.test(normalized)) return '#D4B77E';
      if (/giall|yellow/.test(normalized)) return '#E8C858';
      if (/marron|brown/.test(normalized)) return '#90715B';
      return '#9CA3AF';
    }
    // Latest numbered generation first within each family (e.g. iPhone 18, 17, 16;
    // Galaxy S26, S25; Galaxy A57, A56). Names without a generation follow.
    function generationNumber(name) {
      const cleaned = String(name || '').replace(/\b(?:4G|5G|LTE|256GB|512GB|128GB)\b/gi, '');
      const match = cleaned.match(/(?:^|\s|[-])(?:[A-Za-z]{0,8}\s*)?(\d{1,3})(?=\b|[a-z+])/i);
      return match ? Number(match[1]) : -1;
    }
    function compareModelsNewest(a,b) {
      const genDiff = generationNumber(b.name) - generationNumber(a.name);
      return genDiff || b.name.localeCompare(a.name, 'it', {numeric:true, sensitivity:'base'});
    }
    function compareFamiliesNewest(a,b) {
      // Only use the generation when the family shares the same textual prefix.
      const prefix = f => f.name.replace(/\d.*$/,'').trim().toLowerCase();
      if (prefix(a) === prefix(b)) {
        const n = generationNumber(b.name) - generationNumber(a.name);
        if (n) return n;
      }
      return a.name.localeCompare(b.name,'it',{numeric:true,sensitivity:'base'});
    }
    function normalizeCategory(c) {
      const key = String(c).toLowerCase().replace(/[^a-z]/g,'');
      return ({smartphone:'Smartphone',smartwatch:'Smartwatch',sportwatch:'Smartwatch',smartband:'Smartwatch',ring:'Ring',smartring:'Ring'})[key] || 'Smartphone';
    }
    function convertCatalog(data) {
      const families = [];
      const byKey = new Map();
      for (const p of (data.products || [])) {
        const brandName = String(p.brand || '').trim();
        if (!brandName || !p.model || !Array.isArray(p.variants)) continue;
        const brandId = slugify(brandName);
        if (!state.brands.some(b => b.id === brandId)) {
          state.brands.push({id:brandId,name:brandName,logo:`<span class="font-extrabold">${escapeHtml(brandName)}</span>`});
        }
        const category = normalizeCategory(p.category);
        const familyName = String(p.series || p.model).trim();
        const key = [brandId,category,familyName.toLowerCase()].join('|');
        let family = byKey.get(key);
        if (!family) {
          family = {id:'fam-'+slugify(key),brandId,name:familyName,category,source:'CATALOGO',models:[]};
          families.push(family); byKey.set(key,family);
        }
        let model = family.models.find(m => m.name.toLowerCase() === String(p.model).toLowerCase());
        if (!model) {
          model = {id:'mod-'+slugify(key+'-'+p.model),name:String(p.model),designStyle: category==='Smartphone'?'iphone-single':category==='Ring'?'ring':String(p.category).toLowerCase()==='smartband'?'band-slim':String(p.category).toLowerCase()==='sportwatch'?'sport-rugged':'watch-round',source:'CATALOGO',image:p.image||'',memories:[]};
          family.models.push(model);
        }
        for (const v of p.variants) {
          if (!/^\d{6}$/.test(String(v.pim))) continue;
          const size = String(v.storage || 'Standard');
          let mem = model.memories.find(m => m.size === size);
          if (!mem) {mem={size,variants:[]};model.memories.push(mem);}
          if (!mem.variants.some(x => x.pim === String(v.pim))) mem.variants.push({id:'pim-'+v.pim,colorName:String(v.color||'Colore'),colorHex:(/^#[0-9a-f]{6}$/i.test(String(v.colorHex||'')) ? v.colorHex : inferColorHex(v.color)),pim:String(v.pim),source:'CATALOGO'});
        }
      }
      for (const family of families) family.models.sort(compareModelsNewest);
      families.sort((a,b) => a.brandId.localeCompare(b.brandId,'it') || compareFamiliesNewest(a,b));
      return families;
    }
    function saveManualCatalog() {
      const manual = [];
      for (const family of state.families) for (const model of family.models) for (const mem of model.memories) for (const v of mem.variants) {
        if (v.source === 'MANUALE') manual.push({brand:state.brands.find(b=>b.id===family.brandId)?.name||family.brandId,category:family.category,series:family.name,model:model.name,storage:mem.size,color:v.colorName,colorHex:v.colorHex,pim:v.pim});
      }
      try {localStorage.setItem(MW_MANUAL_KEY,JSON.stringify(manual));}catch(e){showToast('Memoria locale non disponibile: esporta il catalogo.');}
    }
    function restoreManualCatalog() {
      for (const item of safeRead(MW_MANUAL_KEY, [])) {
        item.category = normalizeCategory(item.category);
        if (!/^\d{6}$/.test(String(item.pim)) || getAllFlattenedVariants().some(v=>v.pim===item.pim)) continue;
        let brand=state.brands.find(b=>b.name.toLowerCase()===String(item.brand).toLowerCase());
        if(!brand){brand={id:slugify(item.brand),name:item.brand,logo:`<span class="font-extrabold">${escapeHtml(item.brand)}</span>`};state.brands.push(brand);}
        let fam=state.families.find(f=>f.brandId===brand.id&&f.name===item.series&&f.category===item.category);
        if(!fam){fam={id:'manual-fam-'+slugify(brand.id+item.series+item.category),brandId:brand.id,name:item.series,category:item.category,source:'MANUALE',models:[]};state.families.push(fam);}
        let mod=fam.models.find(m=>m.name===item.model);
        if(!mod){mod={id:'manual-mod-'+slugify(fam.id+item.model),name:item.model,designStyle:'',source:'MANUALE',memories:[]};fam.models.push(mod);}
        let mem=mod.memories.find(m=>m.size===item.storage);
        if(!mem){mem={size:item.storage,variants:[]};mod.memories.push(mem);}
        mem.variants.push({id:'pim-'+item.pim,colorName:item.color,colorHex:item.colorHex||inferColorHex(item.color),pim:item.pim,source:'MANUALE'});
      }
    }
    async function bootRealCatalog() {
      const savedTheme = localStorage.getItem('codici-mw-theme');
      state.theme = savedTheme === 'dark' || (!savedTheme && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.classList.toggle('dark',state.theme==='dark');
      document.documentElement.classList.toggle('light',state.theme!=='dark');
      try {
        const response=await fetch('./catalogo.json?v='+Date.now(),{cache:'no-store'});
        if(!response.ok) throw new Error('HTTP '+response.status);
        const data=await response.json();
        state.families=convertCatalog(data);
        restoreManualCatalog();
        renderApp();
      } catch(err) {
        document.getElementById('app-main').innerHTML=`<div class="bg-white dark:bg-dark-card rounded-2xl border border-red-300 p-6"><h1 class="font-bold text-mw-red">Catalogo non disponibile</h1><p class="mt-2 text-sm">Impossibile leggere catalogo.json. Apri l'app dal sito GitHub Pages, non direttamente dal file HTML.</p><p class="mt-2 text-xs">${escapeHtml(err.message)}</p></div>`;
      }
    }

    window.addEventListener('DOMContentLoaded', bootRealCatalog);
  </script>
